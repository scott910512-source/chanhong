# web/ 폴더를 GitHub Pages 로 올린다.
# 폰에서 열 https 주소가 생기고, 그 주소로 들어가서 '홈 화면에 추가' 하면 앱이 된다.
# (서비스워커는 https 에서만 동작하므로 오프라인 실행에도 이게 필요하다)
#
# 처음 한 번만: 저장소 Settings > Pages > Source 를 "GitHub Actions" 로 바꿔주세요.
name: Deploy PWA to Pages

on:
  push:
    branches: [main, claude/stock-portfolio-manager-hqogew]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 앱 파일 점검
        run: |
          test -f web/index.html
          test -f web/manifest.webmanifest
          test -f web/sw.js
          node --check web/js/app.js || true
          echo "PWA 파일 확인 완료"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
