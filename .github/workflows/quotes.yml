# 야후에서 시세를 받아 web/quotes.json 으로 커밋한다.
# 폰 브라우저는 CORS 때문에 야후를 직접 못 부르므로, 액션이 대신 받아서
# 앱과 같은 주소에 파일로 올려두면 앱이 그냥 읽어간다. (키 불필요)
#
# 받아올 종목은 web/watchlist.json 에서 관리합니다.
name: 시세 자동수집

on:
  schedule:
    # 국내장(09:00~15:30 KST = 00:00~06:30 UTC) 30분마다
    - cron: '0,30 0-7 * * 1-5'
    # 미국장(09:30~16:00 ET ≈ 14:30~21:00 UTC) 30분마다
    - cron: '0,30 14-21 * * 1-5'
  workflow_dispatch:
  push:
    paths: ['web/watchlist.json', 'tools/fetch_quotes.py', '.github/workflows/quotes.yml']

permissions:
  contents: write

concurrency:
  group: quotes
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 시세 받기
        run: python tools/fetch_quotes.py

      - name: 바뀐 게 있으면 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # quotes.json 이 아직 추적되지 않는 새 파일일 수 있어서 먼저 스테이지에 올린다.
          # (git diff 는 untracked 파일을 변경으로 보지 않아 첫 실행이 그냥 넘어간다)
          git add web/quotes.json
          if git diff --cached --quiet -- web/quotes.json; then
            echo "시세 변동 없음 - 커밋 생략"
            exit 0
          fi
          git commit -m "시세 자동수집 $(date -u +'%Y-%m-%d %H:%M UTC')"
          # 다른 워크플로가 먼저 push 했을 수 있으니 몇 번 재시도한다
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "push 실패 - 원격을 당겨서 재시도 ($i)"
            git pull --rebase origin "${GITHUB_REF_NAME}" || exit 1
          done
          exit 1
