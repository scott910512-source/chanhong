<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f7">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
<meta name="description" content="찬홍팍의 보유 주식과 국가별·섹터별 비중을 관리하는 앱">
<title>찬홍팍 주식관리</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="찬홍팍">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="nav">
  <div class="nav-bar">
    <h1>찬홍팍</h1>
    <div class="nav-actions">
      <button id="btnLogin" class="btn-plain strong" hidden>로그인</button>
      <button id="btnInstall" class="btn-plain" hidden>설치</button>
      <button id="btnAdd" class="btn-add" aria-label="내 주식 관리">내 주식 관리</button>
    </div>
  </div>
  <div class="seg">
    <button class="seg-item on" data-screen="home">현황</button>
    <button class="seg-item" data-screen="trades">관리</button>
    <button class="seg-item" data-screen="settings">설정</button>
  </div>
</header>

<main>
  <!-- ══════════ 현황 ══════════ -->
  <section id="screen-home" class="screen on">
    <div id="summary" class="summary"></div>
    <div id="loginBar"></div>
    <div id="topWarn"></div>
    <div id="statusBar"></div>

    <p class="group-title">내 종목 <span id="posCount" class="tail"></span></p>
    <div id="listPositions" class="group"></div>

    <p class="group-title">국가별 비중</p>
    <div id="listCountry" class="group"></div>

    <p class="group-title">섹터별 비중</p>
    <div id="listSector" class="group"></div>

    <div class="group-foot">
      <button id="btnRefresh" class="btn-plain wide">시세 새로고침</button>
    </div>
  </section>

  <!-- ══════════ 거래 ══════════ -->
  <section id="screen-trades" class="screen">
    <div class="search-wrap">
      <input id="txSearch" class="search" type="search" placeholder="종목 검색">
    </div>
    <p class="group-title">내 주식 <span id="txCount" class="tail"></span></p>
    <div id="manageList" class="group"></div>
    <div class="group-foot">
      <button id="btnAddStock" class="btn-plain wide">+ 새 종목 추가</button>
    </div>
    <p class="group-hint">종목을 누르면 매매 내역이 펼쳐집니다.
      거기서 매수·매도를 더 넣거나 고치고 지울 수 있습니다.</p>
  </section>

  <!-- ══════════ 설정 ══════════ -->
  <section id="screen-settings" class="screen">
    <p class="group-title">국가별 목표 비중</p>
    <div id="setCountry" class="group"></div>
    <p class="group-hint">합이 100%가 되게 넣으면 편합니다. 비워두면 그 국가는 판정하지 않습니다.</p>

    <p class="group-title">섹터별 목표 비중</p>
    <div id="setSector" class="group"></div>

    <p class="group-title">종목별 목표</p>
    <div id="setTicker" class="group"></div>
    <p class="group-hint">종목은 비중%·투자금액·주 수량 중에 골라서 걸 수 있습니다.</p>

    <p class="group-title">시세</p>
    <div id="setQuotes" class="group"></div>

    <p class="group-title">더보기</p>
    <div class="group">
      <button class="row tap" data-open="sync"><span>기기 동기화</span><span class="chev">›</span></button>
      <button class="row tap" data-open="rules"><span>매매 안전장치</span><span class="chev">›</span></button>
      <button class="row tap" data-open="bypass"><span>예외 처리</span><span class="chev">›</span></button>
      <button class="row tap" data-open="assets"><span>종목 정보</span><span class="chev">›</span></button>
      <button class="row tap" data-open="fx"><span>환율</span><span class="chev">›</span></button>
      <button class="row tap" data-open="data"><span>데이터 백업·복원</span><span class="chev">›</span></button>
    </div>

    <p class="foot">데이터는 이 기기에만 저장됩니다. 서버로 보내지 않습니다.</p>
  </section>
</main>

<!-- ══════════ 거래 입력 시트 ══════════ -->
<div id="sheet" class="sheet" hidden>
  <div class="backdrop" data-close></div>
  <div class="sheet-body">
    <div class="sheet-bar">
      <button class="btn-plain" data-close>취소</button>
      <b id="sheetTitle">거래 추가</b>
      <button class="btn-plain strong" id="btnSaveTx">저장</button>
    </div>

    <!-- 1단계: 종목 고르기 -->
    <div id="pickStep">
      <div class="search-wrap">
        <input id="pickSearch" class="search" type="search" autocomplete="off"
               placeholder="종목 검색 (삼성, apple, 005930, ㅅㅅㅈㅈ)">
      </div>
      <div id="pickResults" class="group"></div>
    </div>

    <!-- 2단계: 내용 입력 -->
    <form id="txForm" hidden>
      <button type="button" id="pickedChip" class="picked"></button>
      <div class="group">
        <label class="row"><span>구분</span>
          <select name="side">
            <option value="BUY">매수</option>
            <option value="SELL">매도</option>
          </select>
        </label>
        <label class="row"><span>일자</span><input name="date" type="date" required></label>
        <label class="row"><span>수량</span>
          <input name="quantity" type="text" inputmode="decimal" placeholder="0" required></label>
        <label class="row"><span id="priceLabel">단가</span>
          <input name="price" type="text" inputmode="decimal" placeholder="0" required></label>
        <label class="row"><span>수수료</span>
          <input name="fee" type="text" inputmode="decimal" placeholder="0"></label>
        <label class="row"><span>계좌</span>
          <input name="account" list="accountList" placeholder="키움" autocomplete="off">
          <datalist id="accountList"></datalist></label>
        <label class="row"><span>메모</span><input name="note" placeholder="선택"></label>
      </div>
      <p id="txPreview" class="group-hint"></p>
      <div class="group-foot">
        <button type="button" id="btnDeleteTx" class="btn-plain wide danger" hidden>이 거래 삭제</button>
      </div>
    </form>
  </div>
</div>

<!-- ══════════ 더보기 시트 ══════════ -->
<div id="moreSheet" class="sheet" hidden>
  <div class="backdrop" data-close-more></div>
  <div class="sheet-body">
    <div class="sheet-bar">
      <span style="width:44px"></span>
      <b id="moreTitle"></b>
      <button class="btn-plain strong" data-close-more>완료</button>
    </div>
    <div id="moreBody"></div>
  </div>
</div>

<input id="fileInput" type="file" accept=".json,.csv,.tsv,.txt" hidden>
<div id="toast" class="toast"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
