# =============================================================================
#  내 주식 관리 시스템 설정
#  - 여기만 고치면 종목/목표비중/경고기준/예외(bypass)가 전부 바뀝니다.
#  - 매매 이력은 data/transactions.csv 에 직접 입력합니다.
# =============================================================================

base_currency: KRW          # 모든 비중/평가금액을 이 통화로 환산

# -----------------------------------------------------------------------------
# 종목 마스터 - 국가/통화/섹터를 여기서 정의해야 국가별·섹터별 집계가 됩니다.
#   ticker 규칙: 미국 AAPL / 한국 005930.KS(코스피) 000000.KQ(코스닥) / 베트남 FPT.VN
#   symbols 로 공급자별 심볼을 따로 지정할 수 있습니다.
# -----------------------------------------------------------------------------
assets:
  005930.KS:
    name: 삼성전자
    country: KR
    currency: KRW
    exchange: KRX
    sector: 반도체
    asset_class: 주식
    tags: [대형주, 배당]
    symbols:
      naver: "005930"

  066570.KS:
    name: LG전자
    country: KR
    currency: KRW
    exchange: KRX
    sector: 가전/전장
    asset_class: 주식
    tags: [대형주, 배당]
    symbols:
      naver: "066570"

  AAPL:
    name: 애플
    country: US
    currency: USD
    exchange: NASDAQ
    sector: IT하드웨어
    asset_class: 주식
    tags: [대형주, 빅테크]

  AMZN:
    name: 아마존
    country: US
    currency: USD
    exchange: NASDAQ
    sector: 소비재/클라우드
    asset_class: 주식
    tags: [대형주, 빅테크]

  TSLA:
    name: 테슬라
    country: US
    currency: USD
    exchange: NASDAQ
    sector: 자동차
    asset_class: 주식
    tags: [성장주, 고변동]

  FPT.VN:
    name: FPT
    country: VN
    currency: VND
    exchange: HOSE
    sector: IT서비스
    asset_class: 주식
    tags: [신흥국, 성장주]
    symbols:
      vietnam: FPT

# -----------------------------------------------------------------------------
# 목표 비중 - 여기를 벗어나면 매수/매도 안내가 나갑니다.
#   target        목표 비중(%)
#   tolerance     그룹 공통 허용오차(±%p). 개별 min/max 를 쓰면 그게 우선
#   min / max     직접 지정하는 하한/상한(%)
#   bypass: true  이 항목만 안내 끄기
#   enabled: false 로 그룹 전체를 끌 수도 있습니다.
# -----------------------------------------------------------------------------
targets:
  country:
    tolerance: 5
    items:
      KR: {target: 30}
      US: {target: 55, min: 45, max: 62, note: "환율 부담 있어 상한 타이트하게"}
      VN: {target: 15, tolerance: 3}

  ticker:
    tolerance: 4
    items:
      005930.KS: {target: 20}
      066570.KS: {target: 10}
      AAPL: {target: 22}
      AMZN: {target: 16}
      TSLA: {target: 17}
      FPT.VN: {target: 15}

  sector:
    tolerance: 8
    items:
      반도체: {target: 20}
      가전/전장: {target: 10}
      IT하드웨어: {target: 22}
      소비재/클라우드: {target: 16}
      자동차: {target: 17, max: 20, note: "변동성 커서 상한 강제"}
      IT서비스: {target: 15, min: 13, note: "베트남 비중과 연동"}

# -----------------------------------------------------------------------------
# 종목 단위 안전장치
# -----------------------------------------------------------------------------
rules:
  cash: 0                    # 예수금(기준통화). --cash 로 덮어쓸 수 있음
  max_position_weight: 30    # 1종목이 이 비중을 넘으면 매도 안내
  min_position_weight: 3     # 자투리 종목 정리 안내
  take_profit_pct: 60        # 수익률이 이만큼이면 일부 익절 검토
  stop_loss_pct: -25         # 손절선
  min_trade_amount: 300000   # 조정금액이 이보다 작으면 '참고'로만 표시(잦은 매매 방지)

# -----------------------------------------------------------------------------
# 예외 처리(BYPASS) - 안내를 무시할 항목
#   scope: ticker | country | sector | currency | account | asset_class | rule | all
#   until 이 지나면 자동으로 다시 감시합니다.
#   CLI 로도 가능:  --bypass TSLA   --bypass country:VN=환전이슈   --no-bypass(전수점검)
# -----------------------------------------------------------------------------
bypass:
  enabled: true
  entries:
    - scope: ticker
      key: TSLA
      reason: 장기 보유 종목이라 비중 초과해도 매도 안 함
      until: 2026-12-31
    - scope: sector
      key: IT서비스
      reason: 베트남 계좌 환전 절차가 번거로워 당분간 손대지 않음

# -----------------------------------------------------------------------------
# 시세 공급자 - 위에서부터 순서대로 시도하고 첫 성공 값을 씁니다.
#   키가 필요한 곳은 환경변수를 넣으면 자동 활성화 (없으면 자동으로 건너뜀)
#   FINNHUB_API_KEY / TWELVE_DATA_API_KEY / ALPHAVANTAGE_API_KEY / MARKETSTACK_API_KEY
# -----------------------------------------------------------------------------
providers:
  order: [yahoo, naver, vietnam, stooq, finnhub, twelvedata, marketstack, alphavantage]
  cache_ttl_seconds: 300     # 이 시간 안에 받은 값은 재사용(API 호출 아끼기)
  timeout_seconds: 10
